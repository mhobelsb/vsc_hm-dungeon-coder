# The Python package `dungeoncoder` as a wheel (P1 in the dev workspace's repo plan).
# Same version as the extension (package.json); `npm run check:version` compares them.
# Build: `npm run generate` first (writes _api_config.py), then `npm run build:wheel`.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeoncoder"
dynamic = ["version"]
description = "Python API for Dungeon Coder: steer the hero from a script, in VS Code or in the built-in simulator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["httpx>=0.27", "attrs>=23.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/mhobelsb/vscode-dungeon-coder_v2"

[tool.setuptools.dynamic]
version = { attr = "dungeoncoder.__version__" }

[tool.setuptools.packages.find]
include = ["dungeoncoder*"]

[tool.setuptools.package-data]
dungeoncoder = ["packs/*.json", "requirements.txt"]

openapi: 3.0.3
info:
  title: Dungeon Coder API
  version: 0.2.1
  description: |
    Single source of truth for the Dungeon Coder REST API. This spec drives,
    via generators wired into `npm run generate`:
      - runtime request validation in the extension host (express-openapi-validator)
      - TypeScript request/response types for src/extension.ts (openapi-typescript)
      - the shared webview command registry, game/src/commands.js (tools/generate-commands.mjs)
      - the generated low-level Python client under api/python/dungeoncoder/_client
        (openapi-python-client), wrapped by the hand-written, student-facing
        Hero/Game/Level classes in api/python/dungeoncoder/dungeoncoder.py

    Note on status codes: `result: false` for an ordinary business outcome
    (e.g. "move blocked by a wall") is, for historical reasons, returned with
    HTTP 500 rather than 200 - the same status used for actual RPC/transport
    failures. This is preserved as-is: the student-facing Python wrapper
    (`_call` in api/python/dungeoncoder/dungeoncoder.py) turns both cases into
    the method's default return value (`False`, `[]` or `None`), and older
    copies of the package in student workspaces rely on the 500. Changing it
    is a breaking change to every student-facing method (`move()`,
    `pickup()`, ...) and out of scope for this spec.
servers:
  - url: http://127.0.0.1:3000

# RPC method names used between the extension host and the webview that have
# no HTTP surface of their own (is_moving drives the move-completion poll
# loop internally). Listed here so tools/generate-commands.mjs can treat
# this spec as the complete source of truth for the webview's command
# registry, not just its HTTP-exposed subset.
x-internal-commands:
  - is_moving

paths:
  /hero/move:
    post:
      operationId: move
      summary: Move the hero one tile forward.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/turn_left:
    post:
      operationId: turn_left
      summary: Turn the hero 90 degrees to the left.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/interact:
    post:
      operationId: interact
      summary: Interact with whatever the hero is facing (torch, switch, door, chest, ...).
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/configure:
    post:
      operationId: configure
      summary: Set the hero's display name and sprite variant.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureParams'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/pace:
    post:
      operationId: set_pace
      summary: Scale the hero's movement/turn animation speed.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaceParams'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/pickup:
    post:
      operationId: pickup
      summary: Pick up the named item at the hero's current position.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameParam'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/drop:
    post:
      operationId: drop
      summary: Drop the named item from the hero's inventory.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameParam'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/get_items_at_position:
    get:
      operationId: get_items_at_position
      summary: List item names at the hero's current position.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/StringArraySuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_enemy_in_front:
    get:
      operationId: is_enemy_in_front
      summary: Whether a guard stands on the tile in front of the hero.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/ask_oracle:
    get:
      operationId: ask_oracle
      summary: The oracle's advice, the first step of a shortest way to the exit ("north", "east", "south" or "west"); null on the goal or without a way. Needs the map property `orakel`.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/NullableStringSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/read_item_value:
    get:
      operationId: read_item_value
      summary: Value of the item on the hero's field (e.g. a crystal's weight); null if there is none.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/NullableIntegerSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/sense_goal:
    get:
      operationId: sense_goal
      summary: The amulet - how many fields the goal is away as the crow flies (columns plus rows, walls not counted). Needs the map property `amulett`.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/NullableIntegerSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/peek_item_value:
    post:
      operationId: peek_item_value
      summary: Value of the item `distance` fields ahead (1 = the field in front); null if there is none. Needs the map property `fernrohr`.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistanceParam'
      responses:
        '200':
          $ref: '#/components/responses/NullableIntegerSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/inventory:
    get:
      operationId: get_inventory
      summary: List item names currently in the hero's inventory.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/StringArraySuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_collision_in_front:
    get:
      operationId: is_collision_in_front
      summary: Whether a solid obstacle blocks the tile in front of the hero.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_facing_north:
    get:
      operationId: is_facing_north
      summary: Whether the hero currently faces north.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_at_goal:
    get:
      operationId: is_at_goal
      summary: Whether the hero stands on the level's goal field (the level may still need its win conditions, see /game/statistics).
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_torch_in_front:
    get:
      operationId: is_torch_in_front
      summary: Whether a torch is on the tile in front of the hero.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_switch_in_front:
    get:
      operationId: is_switch_in_front
      summary: Whether a switch is on the tile in front of the hero.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /hero/is_abyss_in_front:
    get:
      operationId: is_abyss_in_front
      summary: Whether the tile in front of the hero is an impassable abyss.
      tags: [Hero]
      parameters:
        - $ref: '#/components/parameters/HeroIndex'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /game/statistics:
    get:
      operationId: get_statistics
      summary: Counters of the current level (moves, turns, bumps, ...) and whether it is complete.
      tags: [Game]
      responses:
        '200':
          $ref: '#/components/responses/StatisticsSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /version:
    get:
      operationId: get_version
      summary: The versions of the extension and of this API, so a client can tell whether it fits.
      description: |
        Answered by the server itself (x-host), not by the game. The Python
        package compares it with its own version once per program and warns if
        a copied package doesn't fit the running extension.
      tags: [Game]
      x-host: true
      responses:
        '200':
          $ref: '#/components/responses/VersionSuccess'

  /level/load:
    post:
      operationId: load_level
      summary: Load a level from a Tiled JSON export.
      tags: [Level]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TiledLevel'
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

  /level/reset:
    post:
      operationId: reset_level
      summary: Reload the most recently loaded level from scratch.
      tags: [Level]
      responses:
        '200':
          $ref: '#/components/responses/BooleanSuccess'
        '500':
          $ref: '#/components/responses/Error'

components:
  parameters:
    HeroIndex:
      name: hero
      in: query
      required: false
      description: which hero, in a level with several (0 = MainCharacter, the default; Game.get_heroes())
      schema:
        type: integer
        minimum: 0
  responses:
    BooleanSuccess:
      description: Operation completed; result carries its boolean outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BooleanResult'
    StringArraySuccess:
      description: Operation completed; result carries a list of item names.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StringArrayResult'
    NullableIntegerSuccess:
      description: Operation completed; result carries an integer, or null if there is nothing to read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NullableIntegerResult'
    NullableStringSuccess:
      description: Operation completed; result carries a string, or null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NullableStringResult'
    StatisticsSuccess:
      description: Operation completed; result carries the level's counters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatisticsResult'
    VersionSuccess:
      description: The versions of the running extension and its API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionResult'
    Error:
      description: RPC-level failure, or an ordinary negative business outcome (see info.description).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        exception:
          type: string

    BooleanResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          type: boolean

    StringArrayResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          type: array
          items:
            type: string

    NullableIntegerResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          type: integer
          nullable: true

    NullableStringResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          type: string
          nullable: true

    VersionResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          type: object
          required: [extension, api]
          properties:
            extension:
              type: string
              description: version of the extension (package.json), e.g. 0.1.0
            api:
              type: string
              description: version of this API description (info.version)

    StatisticsResult:
      type: object
      required: [status, message, result]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        result:
          $ref: '#/components/schemas/Statistics'

    Statistics:
      type: object
      description: Counters since the level was (re)loaded.
      required: [moves, turns, bumps, keyboard_moves, interactions, pickups, drops, sensor_calls, reads, questions, at_goal, game_over, level_complete, missing]
      properties:
        moves:
          type: integer
          description: successful move() steps
        turns:
          type: integer
          description: turn_left() turns
        bumps:
          type: integer
          description: move() calls that were blocked
        keyboard_moves:
          type: integer
          description: steps made by hand (WASD)
        interactions:
          type: integer
          description: interact() calls
        pickups:
          type: integer
          description: successful pickup() calls
        drops:
          type: integer
          description: successful drop() calls
        sensor_calls:
          type: integer
          description: calls of is_*_in_front, is_facing_north, is_at_goal and get_items_at_position
        reads:
          type: integer
          description: calls of read_item_value and peek_item_value
        questions:
          type: integer
          description: calls of ask_oracle
        at_goal:
          type: boolean
          description: the hero stands on the goal field
        game_over:
          type: boolean
          description: the hero fell into an abyss or was caught by a guard
        level_complete:
          type: boolean
          description: goal reached and every win condition of the level met
        missing:
          type: array
          items:
            type: string
          description: unmet win conditions, e.g. "3 sweets"
        moves_left:
          type: integer
          nullable: true
          description: move() calls left in a level with the map property max_moves (null without a budget)
        heroes:
          type: integer
          description: number of heroes in the level (co-op levels have more than one)

    NameParam:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Item name, as returned by get_items_at_position/get_inventory.

    DistanceParam:
      type: object
      required: [distance]
      properties:
        distance:
          type: integer
          minimum: 1
          description: How many fields ahead, in the direction the hero faces (1 = the field in front).

    ConfigureParams:
      type: object
      required: [name, typeNumber]
      properties:
        name:
          type: string
          description: Display name shown above the hero.
        typeNumber:
          type: integer
          minimum: 0
          maximum: 15
          description: Selects the hero sprite variant.

    PaceParams:
      type: object
      required: [factor]
      properties:
        factor:
          type: number
          description: Multiplier applied to movement/turn animation speed.

    TiledLevel:
      type: object
      description: >-
        A Tiled (mapeditor.org) JSON map export. Not fully modeled here -
        the game engine (game/src/game.js) is the source of truth for what
        it accepts.
      additionalProperties: true

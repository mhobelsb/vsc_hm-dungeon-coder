name: CI

# Everything here runs on the free pictures only (the demo pack and the CC0 worlds): course art is
# never in this repository.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check:version
      - run: npm run compile
      - run: npm run lint
      - run: npm run compile-tests
      - run: npm run test:engine
      - run: python -m pip install pillow httpx attrs
      - run: npm run test:tools
      - name: VS Code integration tests
        run: xvfb-run -a npm test

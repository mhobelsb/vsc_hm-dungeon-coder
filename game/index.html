<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CSP -->
    <title>Dungeon Coder</title>
</head>
<style nonce="${nonce}">
    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #222;
        color: #eee;
        font-family: monospace;
    }

    canvas {
        border: 2px solid #555;
        background-color: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges; /* Fallback for older browsers */
    }

    #debugInfo {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px;
        border-radius: 5px;
        font-size: 0.9em;
    }
    /* the program's last calls (game/src/call-log.js): only in levels with show_calls: true; L shows or hides it */
    #call-log {
        position: fixed;
        top: 6px;
        right: 6px;
        max-width: 45vw;
        margin: 0;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.72);
        color: #ddd;
        font: 11px/1.35 monospace;
        white-space: pre;
        overflow: hidden;
        border-radius: 4px;
        pointer-events: none;
    }
    #call-log[data-empty="true"] {
        display: none;
    }
    /* the scoreboard of a live game (game/src/arena-board.js): beside the canvas, only while an arena is loaded */
    #arena-board {
        margin-left: 24px;
        min-width: 220px;
        max-width: 30vw;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid #555;
        border-radius: 6px;
        font: 15px/1.4 monospace;
        color: #eee;
    }
    #arena-board h2 {
        margin: 0 0 6px 0;
        font-size: 18px;
    }
    #arena-board .phase {
        margin-bottom: 8px;
        color: #ffcc00;
    }
    #arena-board table {
        border-collapse: collapse;
        width: 100%;
    }
    #arena-board td, #arena-board th {
        padding: 3px 6px;
        text-align: left;
        white-space: nowrap;
    }
    #arena-board td.num {
        text-align: right;
    }
    #arena-board .swatch {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #000;
    }
    #arena-board tr.out {
        color: #888;
    }
    #arena-board .room {
        margin-top: 8px;
        border-top: 1px solid #555;
        padding-top: 6px;
    }
    /* the room's bar towards 80 percent (the room's goal) */
    #arena-board .bar {
        position: relative;
        height: 12px;
        margin-top: 6px;
        background: #333;
        border-radius: 6px;
        overflow: hidden;
    }
    #arena-board .bar i {
        display: block;
        height: 100%;
        background: #2ecc71;
        transition: width .4s ease;
    }
    #arena-board .bar b {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #ffcc00;
    }
    #arena-board .keys {
        margin-top: 8px;
        color: #999;
        font-size: 12px;
    }
    input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: block;
            margin-bottom: 15px;
    }
</style>
<body>
    
    <div class="container">
        <input type="file" id="json-file-input" accept=".json">
        <canvas id="gameCanvas" tabindex="-1" width="640" height="480"></canvas>
    </div>
    <aside id="arena-board" hidden></aside>
    <pre id="call-log" data-empty="true" hidden></pre>
    <script nonce="${nonce}">
        const rawGameFolderUri = '${gameFolderUri}'; 

        let FINAL_GAME_URI;

        // If gameFolderUri was not replaced by VS Code the game is running in the browser
        if (rawGameFolderUri.includes('gameFolderUri') || rawGameFolderUri === '') {
            FINAL_GAME_URI = '';
            console.log("Using local relative path: /");
        } else {
            FINAL_GAME_URI = rawGameFolderUri + "/";
            console.log("Using VS Code URI:", FINAL_GAME_URI);
        }
        window.VscodeGameMediaUri = FINAL_GAME_URI;
        // asset packs (setting dungeonCoder.assetPacks / DC_ASSET_PACKS), searched before the bundled assets
        const rawAssetPackUris = '${assetPackUris}';
        try {
            window.DcAssetPackUris = rawAssetPackUris.includes('assetPackUris') ? [] : JSON.parse(rawAssetPackUris);
        } catch (e) {
            window.DcAssetPackUris = [];
        }
        // the dev server's WebSocket port (DC_WS_PORT); not replaced inside VS Code, where there is no socket
        const rawWsPort = '${wsPort}';
        window.DcWsPort = /^\d+$/.test(rawWsPort) ? Number(rawWsPort) : null;
        const script = document.createElement('script');
        script.type = 'module';
        script.src = FINAL_GAME_URI + "src/script.js";
        script.onload = (event) => {
            const loadedUrl = event.target.src;
            console.log(`Script loaded successfully from: ${loadedUrl}`);
        };
        document.body.appendChild(script);
    </script>
</body>
</html>

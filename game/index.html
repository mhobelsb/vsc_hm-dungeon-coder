<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CSP -->
    <title>Dungeon Coder</title>
</head>
<style nonce="${nonce}">
    body {
        margin: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #222;
        color: #eee;
        font-family: monospace;
    }

    canvas {
        border: 2px solid #555;
        background-color: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges; /* Fallback for older browsers */
    }

    #debugInfo {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 5px;
        border-radius: 5px;
        font-size: 0.9em;
    }
    /* the program's last calls (game/src/call-log.js): only in levels with show_calls: true; L shows or hides it */
    #call-log {
        position: fixed;
        top: 6px;
        right: 6px;
        max-width: 45vw;
        margin: 0;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.72);
        color: #ddd;
        font: 11px/1.35 monospace;
        white-space: pre;
        overflow: hidden;
        border-radius: 4px;
        pointer-events: none;
    }
    #call-log[data-empty="true"] {
        display: none;
    }
    input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: block;
            margin-bottom: 15px;
    }
</style>
<body>
    
    <div class="container">
        <input type="file" id="json-file-input" accept=".json">
        <canvas id="gameCanvas" tabindex="-1" width="640" height="480"></canvas>
    </div>
    <pre id="call-log" data-empty="true" hidden></pre>
    <script nonce="${nonce}">
        const rawGameFolderUri = '${gameFolderUri}'; 

        let FINAL_GAME_URI;

        // If gameFolderUri was not replaced by VS Code the game is running in the browser
        if (rawGameFolderUri.includes('gameFolderUri') || rawGameFolderUri === '') {
            FINAL_GAME_URI = '';
            console.log("Using local relative path: /");
        } else {
            FINAL_GAME_URI = rawGameFolderUri + "/";
            console.log("Using VS Code URI:", FINAL_GAME_URI);
        }
        window.VscodeGameMediaUri = FINAL_GAME_URI;
        // asset packs (setting dungeonCoder.assetPacks / DC_ASSET_PACKS), searched before the bundled assets
        const rawAssetPackUris = '${assetPackUris}';
        try {
            window.DcAssetPackUris = rawAssetPackUris.includes('assetPackUris') ? [] : JSON.parse(rawAssetPackUris);
        } catch (e) {
            window.DcAssetPackUris = [];
        }
        const script = document.createElement('script');
        script.type = 'module';
        script.src = FINAL_GAME_URI + "src/script.js";
        script.onload = (event) => {
            const loadedUrl = event.target.src;
            console.log(`Script loaded successfully from: ${loadedUrl}`);
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
